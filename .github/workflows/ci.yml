name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # Build: .NET solution + web app
  # --------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore .NET dependencies
        run: dotnet restore src/Northwoods.slnx

      - name: Build .NET solution
        run: dotnet build src/Northwoods.slnx --no-restore --configuration Release

      - name: Set up Node / pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install web dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Build web app
        run: pnpm --dir apps/web build

  # --------------------------------------------------------------------------
  # Test: unit and integration test projects under tests/
  # --------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore .NET dependencies (includes test projects)
        run: |
          for proj in tests/**/*.csproj; do
            dotnet restore "$proj"
          done

      - name: Run unit tests
        run: |
          dotnet test tests/Northwoods.Tenancy.UnitTests/Northwoods.Tenancy.UnitTests.csproj \
            --no-restore --configuration Release --logger "console;verbosity=normal"
          dotnet test tests/Northwoods.Worker.UnitTests/Northwoods.Worker.UnitTests.csproj \
            --no-restore --configuration Release --logger "console;verbosity=normal"

      # Integration tests require a live Postgres + MinIO instance.
      # Run only when the required services are available (skipped on PR forks).
      - name: Run integration tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet test tests/Northwoods.Api.IntegrationTests/Northwoods.Api.IntegrationTests.csproj \
            --no-restore --configuration Release --logger "console;verbosity=normal"
        env:
          ConnectionStrings__Default: ${{ secrets.TEST_DB_CONNECTION_STRING }}

  # --------------------------------------------------------------------------
  # Playwright: e2e smoke tests (frontend-only subset)
  # --------------------------------------------------------------------------
  playwright:
    name: Playwright Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node / pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install web dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: pnpm --dir apps/web exec playwright test --grep-invert "@backend"

      - name: Upload Playwright report
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  # --------------------------------------------------------------------------
  # ADR compliance: RLS isolation + append-only extraction attempts
  # --------------------------------------------------------------------------
  adr-compliance:
    name: ADR Compliance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check RLS tenant isolation (ADR 004)
        run: python3 scripts/ci/check-rls-compliance.py

      - name: Check append-only extraction attempts (ADR 005)
        run: python3 scripts/ci/check-append-only-attempts.py

  # --------------------------------------------------------------------------
  # Secret scan: no committed secrets
  # --------------------------------------------------------------------------
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for committed secrets
        run: bash scripts/ci/check-no-secrets.sh
