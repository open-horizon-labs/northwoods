services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: northwoods
      POSTGRES_PASSWORD: northwoods
      POSTGRES_DB: northwoods
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northwoods"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: northwoods
      MINIO_ROOT_PASSWORD: northwoods
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: src
      dockerfile: Services/Northwoods.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Database=northwoods;Username=northwoods;Password=northwoods
      Minio__Endpoint: minio:9000
      Minio__AccessKey: northwoods
      Minio__SecretKey: northwoods
      Minio__BucketName: intakes
      Minio__PublicEndpoint: localhost:9000
      Auth__Jwt__SigningKey: change-me-at-least-32-chars-for-hs256
      Auth__Jwt__Issuer: northwoods-api
      Auth__Jwt__Audience: northwoods-web
      Auth__ReviewerCanUpload: false
    ports:
      - "5100:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: src
      dockerfile: Workers/Extraction.Worker/Dockerfile
    environment:
      ConnectionStrings__Default: Host=postgres;Database=northwoods;Username=northwoods;Password=northwoods
      Minio__Endpoint: minio:9000
      Minio__AccessKey: northwoods
      Minio__SecretKey: northwoods
      Minio__BucketName: intakes
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
