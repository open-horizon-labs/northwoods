server {
    listen $PORT;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # DNS resolver required when proxy_pass uses a variable — nginx resolves at request time
    # Use public resolvers; override with RESOLVER env var if needed
    resolver 1.1.1.1 8.8.8.8 valid=60s;
    resolver_timeout 5s;

    # Proxy API calls to the backend — strips /api prefix to match Vite dev proxy behaviour
    location /api/ {
        client_max_body_size 20m;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $API_URL;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback — all unmatched routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — aggressive caching
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
