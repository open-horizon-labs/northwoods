<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- TraverseLite brand mark: stylized document with a checkmark -->
  <rect width="32" height="32" rx="6" fill="#0369a1"/>
  <!-- Document outline -->
  <rect x="7" y="5" width="14" height="18" rx="1.5" fill="white" opacity="0.15"/>
  <rect x="7" y="5" width="14" height="18" rx="1.5" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Lines on document -->
  <line x1="10" y1="10" x2="18" y2="10" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="10" y1="13" x2="18" y2="13" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="10" y1="16" x2="15" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <!-- Checkmark circle -->
  <circle cx="22" cy="22" r="7" fill="#0369a1"/>
  <circle cx="22" cy="22" r="6.5" fill="#10b981"/>
  <polyline points="18.5,22 21,24.5 25.5,19.5" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
